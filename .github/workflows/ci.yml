# Caminho relativo: .github/workflows/ci.yml
#
# Integração contínua do NeoCAD. Implementa o DoD do AGENTS.md seção 8:
# testes e linter verdes na CI antes do merge.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (check, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # `pnpm build` compila o kernel para WebAssembly (scripts/build-kernel.mjs).
      - name: Toolchain WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          wasm-pack --version

      # Os workers do upstream não são versionados; o manifesto é. Este passo
      # falha se o conteúdo publicado pelo @mlightcad mudou sem revisão.
      - name: Conferir workers do upstream
        run: pnpm workers:check

      - name: Verificação de tipos
        run: pnpm check

      - name: Lint e formatação
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test

      - name: Build do frontend
        run: pnpm build

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  licencas:
    name: Política de licenças
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Falha quando entra na árvore de runtime uma licença desconhecida ou uma
      # dependência copyleft ainda não avaliada. Ver THIRD-PARTY-LICENSES.md.
      - name: Verificar licenças de runtime
        run: pnpm licenses:check

  rust:
    name: Backend Tauri (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # `tauri::generate_context!` exige que `frontendDist` (../build) exista.
      - uses: actions/download-artifact@v6
        with:
          name: frontend-build
          path: build/

      - name: Dependências de sistema do Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            curl wget file libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatação Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  kernel:
    name: Kernel CAD (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # `kernel/rust-toolchain.toml` só é aplicado quando o diretório de trabalho
    # está dentro de `kernel/`. Usar `--manifest-path` a partir da raiz ignoraria
    # o arquivo — e, com ele, os componentes e o alvo wasm declarados.
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v5

      # Sem action de toolchain: o rustup pré-instalado no runner resolve canal,
      # componentes e alvos a partir de kernel/rust-toolchain.toml.
      - name: Toolchain resolvida
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel

      - name: Formatação
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test --all

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # `pnpm build` compila o kernel para WebAssembly (scripts/build-kernel.mjs).
      - name: Toolchain WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          wasm-pack --version

      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium

      # O spec dwg-open.e2e.ts faz skip quando o DWG de referência (132 MB, fora
      # do repositório) não está presente. Os demais rodam sobre e2e/fixtures.
      - name: Rodar E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gratuito para repositórios públicos. Em repositório privado, exige
      # GITLEAKS_LICENSE nos secrets.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
