# Caminho relativo: kernel/neocad-wasm/Cargo.toml
#
# Fachada do kernel para o frontend. É a única crate autorizada a conhecer
# `wasm-bindgen`; as demais permanecem agnósticas quanto ao ambiente (ADR 0003).

[package]
name = "neocad-wasm"
description = "Fachada WebAssembly do kernel CAD do NeoCAD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neocad-geometry = { path = "../neocad-geometry", version = "0.0.0" }
neocad-model = { path = "../neocad-model", version = "0.0.0" }
neocad-transaction = { path = "../neocad-transaction", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[lints]
workspace = true
